name: Java CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: studentdb
          MYSQL_ROOT_PASSWORD: 1234
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p1234 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Grant execute permission for Maven wrapper
        run: chmod +x mvnw

      - name: Build and test
        run: ./mvnw clean verify

      - name: Generate JaCoCo report
        run: ./mvnw jacoco:report

      - name: Check coverage threshold
        shell: bash
        run: |
          python3 - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          report = "target/site/jacoco/jacoco.xml"
          try:
              root = ET.parse(report).getroot()
          except FileNotFoundError:
              print(f"JaCoCo report not found at {report}")
              sys.exit(1)

          instruction_counter = None
          for counter in root.findall("counter"):
              if counter.attrib.get("type") == "INSTRUCTION":
                  instruction_counter = counter
                  break

          if instruction_counter is None:
              print("INSTRUCTION counter is missing from the JaCoCo report.")
              sys.exit(1)

          missed = int(instruction_counter.attrib.get("missed", 0))
          covered = int(instruction_counter.attrib.get("covered", 0))
          total = missed + covered

          if total == 0:
              print("No instruction data was found in the JaCoCo report.")
              sys.exit(1)

          coverage = (covered / total) * 100
          required = 20.0

          print(f"Code Coverage: {coverage:.2f}%")
          print(f"Required Coverage: {required:.2f}%")

          if coverage < required:
              print("QUALITY GATE FAILED")
              sys.exit(1)

          print("QUALITY GATE PASSED")
          PY

      - name: Package JAR
        run: ./mvnw package -DskipTests

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: springboot-application
          path: target/*.jar

      - name: Upload JaCoCo Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
